name: Sync fixtures

# Pulls upcoming World Cup fixtures from football-data.org into MongoDB twice a day.
# Requires two repo secrets (Settings -> Secrets and variables -> Actions):
#   MONGODB_URI          — the same Atlas URI the API uses
#   FOOTBALL_DATA_TOKEN  — free key from football-data.org
on:
  schedule:
    - cron: "0 6,18 * * *" # 06:00 and 18:00 UTC daily
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install deps
        working-directory: api
        run: npm ci
      - name: Sync fixtures
        working-directory: api
        run: node src/sync.js
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
