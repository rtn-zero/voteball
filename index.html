<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  
  <!-- Basic Meta Tags -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  <!-- Meta Tags -->
  <title>Voteball</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap">
  
  <!-- Libraries -->
  <link rel="stylesheet" href="/assets/libraries/radix-colors.css">
  
  <!-- CSS -->
  <link rel="stylesheet" href="/style.css">
  
  <!-- JavaScript -->
  <script src="/assets/libraries/tsparticles.bundle.min.js" defer></script>
  <script src="/script.js" defer></script>

</head>
<body ontouchstart="">
  <div id="stars"></div>
  <div id="content">
    
    <!-- Header -->
    <header class="container">
      <h1>Voteball</h1>
      <p>Pick a team below that you reckon will come out on top in the match!</p>
    </header>
    
    <!-- Main -->
    <main>
      <h2>Match Prediction</h2>

      <div class="team-display">

        <!-- Team 1 -->
        <div class="team">
          <img id="home-flag" src="/assets/flags/fra.svg" alt="Home Flag" width="75" height="75">
          <span id="home-code">FRA</span>
        </div>

        <span>VS</span>

        <!-- Team 2 -->
        <div class="team">
          <img id="away-flag" src="/assets/flags/mar.svg" alt="Away Flag" width="75" height="75">
          <span id="away-code">MAR</span>
        </div>

      </div>
      
      <div class="vote-buttons">
        
        <!-- Team 1 Button -->
        <div class="btn-wrapper">
          <button class="btn home" id="vote-team-1">France</button>
          <span id="prob-home">62%</span>
        </div>

        <!-- Draw Button -->
        <div class="btn-wrapper">
          <button class="btn draw" id="vote-draw">Draw</button>
          <span id="prob-draw">22%</span>
        </div>

        <!-- Team 2 Button -->
        <div class="btn-wrapper">
          <button class="btn away" id="vote-team-2">Morocco</button>
          <span id="prob-away">16%</span>
        </div>

      </div>
      
      <p class="tip">Scroll to change match</p>
    </main>
    
    <!-- 3D Football -->
    <div class="football-container">
      <div class="football"></div>
    </div>
    
  </div>
</body>
</html>
